<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Lost & Found Hub</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX for reactive frontend to backend communication -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <!-- HTMX Server-Sent Events (SSE) extension for real-time match alerts -->
    <script src="https://unpkg.com/htmx.org@1.9.11/dist/ext/sse.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Real-time Match Alerts SSE Listener -->
    <div hx-ext="sse" sse-connect="/alerts/sse">
        <!-- Floating notification toasts container -->
        <div id="toast-container" 
             sse-swap="match-alert" 
             hx-swap="afterbegin" 
             class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none">
        </div>
    </div>

    <!-- Navigation Header -->
    <nav class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="container mx-auto flex flex-wrap justify-between items-center gap-4">
            <a href="/feed" class="flex items-center gap-2 text-xl font-black tracking-tight hover:text-blue-200 transition">
                <span class="bg-blue-600 text-white p-1.5 rounded-lg shadow-inner">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </span>
                <span>Campus Hub</span>
            </a>

            <!-- Navigation Links -->
            <div class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
                <a href="/feed" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition">
                    Browse Feed
                </a>
                <a href="/report" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition">
                    File Report
                </a>
                <a href="/claims" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition flex items-center gap-1.5">
                    <span>Claims Review</span>
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                </a>
                <a href="/audit-logs" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition flex items-center gap-1.5">
                    <span>Audit Trail</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </a>

                <!-- Live SSE Connection Pill -->
                <div class="ml-2 pl-3 border-l border-blue-700 hidden sm:flex items-center gap-1.5 text-xs text-blue-200">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span>Live Alerts</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Modal Container for Claim Vetting & Handover Dialogs -->
    <div id="modal-container"></div>

    <main class="container mx-auto p-4 flex-grow">
        <!-- Jinja2 template block where child pages inject content -->
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-12">
        <div class="container mx-auto">
            <p>Smart Campus Lost &amp; Found Hub &bull; AI Multi-Modal Cosine Ranking &bull; Secure Handover Protocol</p>
        </div>
    </footer>
</body>
</html>
