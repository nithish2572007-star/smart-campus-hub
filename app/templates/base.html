<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Lost &amp; Found Hub</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        campus: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    }
                }
            }
        };
    </script>
    <!-- HTMX for reactive frontend to backend communication -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <!-- HTMX Server-Sent Events (SSE) extension for real-time match alerts -->
    <script src="https://unpkg.com/htmx.org@1.9.11/dist/ext/sse.js"></script>
    <style>
        /* Smooth HTMX indicator transitions */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: flex; }
        .htmx-request.htmx-indicator { display: flex; }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Real-time Match Alerts SSE Listener -->
    <div hx-ext="sse" sse-connect="/alerts/sse">
        <!-- Floating notification toasts container -->
        <div id="toast-container" 
             sse-swap="match-alert" 
             hx-swap="afterbegin" 
             class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full px-4 sm:px-0 pointer-events-none">
        </div>
    </div>

    <!-- Navigation Header -->
    <nav class="bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- Brand Logo -->
            <a href="/feed" class="flex items-center gap-2 text-xl font-black tracking-tight hover:text-blue-200 transition">
                <span class="bg-blue-600 text-white p-1.5 rounded-lg shadow-inner">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </span>
                <span>Campus Hub</span>
            </a>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex items-center gap-2 text-sm font-medium">
                <a href="/feed" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition">
                    Browse Feed
                </a>
                <a href="/report" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition">
                    File Report
                </a>
                <a href="/claims" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition flex items-center gap-1.5">
                    <span>Claims Review</span>
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                </a>
                <a href="/audit-logs" class="px-3 py-1.5 rounded-md hover:bg-white hover:bg-opacity-10 transition flex items-center gap-1.5">
                    <span>Audit Trail</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </a>

                <!-- Live SSE Connection Pill -->
                <div class="ml-2 pl-3 border-l border-blue-700 flex items-center gap-1.5 text-xs text-blue-200">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span>Live Alerts</span>
                </div>
            </div>

            <!-- Mobile Hamburger Button -->
            <div class="flex items-center gap-2 md:hidden">
                <span class="relative flex h-2 w-2 mr-1">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <button type="button" 
                        onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                        class="p-2 rounded-md hover:bg-blue-700 focus:outline-none"
                        aria-label="Toggle navigation">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Collapsible Menu -->
        <div id="mobile-menu" class="hidden md:hidden px-4 pt-2 pb-4 space-y-1 bg-blue-950 border-t border-blue-800 text-sm">
            <a href="/feed" class="block px-3 py-2 rounded-md hover:bg-blue-800 transition">
                Browse Feed
            </a>
            <a href="/report" class="block px-3 py-2 rounded-md hover:bg-blue-800 transition">
                File a Report
            </a>
            <a href="/claims" class="block px-3 py-2 rounded-md hover:bg-blue-800 transition flex items-center justify-between">
                <span>Claims Review</span>
                <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            </a>
            <a href="/audit-logs" class="block px-3 py-2 rounded-md hover:bg-blue-800 transition flex items-center justify-between">
                <span>Audit Trail</span>
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            </a>
        </div>
    </nav>

    <!-- Global Modal Container for Claim Vetting & Handover Dialogs -->
    <div id="modal-container"></div>

    <main class="container mx-auto px-4 py-6 flex-grow">
        <!-- Jinja2 template block where child pages inject content -->
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-12">
        <div class="container mx-auto px-4">
            <p>Smart Campus Lost &amp; Found Hub &bull; PyTorch Multi-Modal Cosine Ranking &bull; Secure Handover Protocol</p>
        </div>
    </footer>

    <!-- Graceful HTMX Error and Timeout Handler -->
    <script>
        document.addEventListener("htmx:responseError", function(evt) {
            showErrorToast("Server encountered an issue (" + evt.detail.xhr.status + "). Please try again.");
        });
        document.addEventListener("htmx:sendError", function(evt) {
            showErrorToast("Network connection lost or server is offline. Please check your network.");
        });
        document.addEventListener("htmx:timeout", function(evt) {
            showErrorToast("Operation timed out while processing AI models. Please refresh and retry.");
        });

        function showErrorToast(message) {
            const container = document.getElementById("toast-container");
            if (!container) return;
            const toast = document.createElement("div");
            toast.className = "pointer-events-auto bg-white border-l-4 border-rose-500 rounded-xl shadow-2xl p-4 flex gap-3 items-start border border-gray-100 max-w-sm animate-in fade-in slide-in-from-top-2";
            toast.innerHTML = `
                <div class="flex-shrink-0 bg-rose-100 text-rose-700 rounded-full p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <div class="flex-grow">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-rose-700 uppercase tracking-wider">Notice</span>
                        <button onclick="this.closest('.pointer-events-auto').remove()" class="text-gray-400 hover:text-gray-600 text-sm">✕</button>
                    </div>
                    <p class="text-xs text-gray-700 mt-1">${message}</p>
                </div>
            `;
            container.prepend(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 8000);
        }
    </script>
</body>
</html>
