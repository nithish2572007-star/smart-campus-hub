<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Lost & Found Hub</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX for reactive frontend to backend communication -->
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">
    <nav class="bg-blue-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Campus Hub</h1>
            <div class="space-x-4">
                <!-- Links will map to FastAPI routes -->
                <a href="/" class="hover:text-gray-300">Home</a>
                <a href="/report" class="hover:text-gray-300">File a Report</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 mt-6">
        <!-- Jinja2 template block where child pages will inject content -->
        {% block content %}{% endblock %}
    </main>
</body>
</html>
