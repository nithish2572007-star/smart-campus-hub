<div class="toast-item pointer-events-auto bg-white border-l-4 border-emerald-500 rounded-xl shadow-2xl p-4 flex gap-3 items-start transition-all duration-300 transform translate-x-0 opacity-100 hover:scale-[1.02] border border-gray-100 max-w-sm"
     id="toast-{{ target.id }}-{{ candidate.id }}">
    <div class="flex-shrink-0 bg-emerald-100 text-emerald-700 rounded-full p-2.5 shadow-inner animate-pulse">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
    </div>
    
    <div class="flex-grow">
        <div class="flex items-center justify-between">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                ⚡ {{ score }}% Match Detected
            </span>
            <button type="button" 
                    onclick="this.closest('.toast-item').remove()" 
                    class="text-gray-400 hover:text-gray-600 p-1 rounded-md hover:bg-gray-100 text-sm">
                ✕
            </button>
        </div>
        
        <h4 class="text-sm font-semibold text-gray-900 mt-1 capitalize">
            {{ target.type.value }}: {{ target.category }}
        </h4>
        
        <p class="text-xs text-gray-600 mt-0.5 line-clamp-2">
            Matches <span class="font-medium text-gray-800">{{ candidate.type.value }} #{{ candidate.id }}</span>: "{{ candidate.description }}"
        </p>
        
        <div class="mt-3 flex items-center gap-2">
            <a href="/report/{{ target.id }}" 
               class="inline-flex items-center text-xs font-medium bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md shadow-sm transition">
                View Match
            </a>
            <a href="/report/{{ candidate.id }}" 
               class="text-xs font-medium text-gray-600 hover:text-gray-900 px-2 py-1.5 rounded-md hover:bg-gray-100 transition">
                Candidate #{{ candidate.id }}
            </a>
        </div>
    </div>
</div>

<script>
    // Auto-remove toast notification after 12 seconds
    setTimeout(function() {
        const toast = document.getElementById("toast-{{ target.id }}-{{ candidate.id }}");
        if (toast) {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            setTimeout(() => toast.remove(), 300);
        }
    }, 12000);
</script>
