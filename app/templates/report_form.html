{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md mt-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">File a Lost or Found Report</h2>
    
    <!-- HTMX form submission -->
    <form hx-post="/report" hx-encoding="multipart/form-data" hx-target="#response-message" class="space-y-6">
        
        <div class="flex space-x-6">
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="type" value="Lost" class="form-radio text-blue-600" required>
                <span>Lost Item</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="type" value="Found" class="form-radio text-blue-600" required>
                <span>Found Item</span>
            </label>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Category</label>
            <select name="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" required>
                <option value="" disabled selected>Select category...</option>
                <option value="wallet">Wallet</option>
                <option value="bottle">Bottle</option>
                <option value="earphones">Earphones</option>
                <option value="id_card">ID Card</option>
                <option value="electronics">Electronics</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Campus Location</label>
            <select name="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" required>
                <option value="" disabled selected>Select building...</option>
                <option value="SJT">Silver Jubilee Tower (SJT)</option>
                <option value="TT">Technology Tower (TT)</option>
                <option value="Library">Central Library</option>
                <option value="MB">Main Building</option>
                <option value="Hostel_Blocks">Hostel Blocks</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Time</label>
            <input type="datetime-local" name="event_time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Description</label>
            <textarea name="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="Provide details about the item..." required></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Photo Upload</label>
            <input type="file" name="photo" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" required>
        </div>

        <!-- Hidden field for finder's secret note (used later for claims) -->
        <div id="secret-note-container" class="hidden">
            <label class="block text-sm font-medium text-gray-700">Secret Note (For verification)</label>
            <textarea name="finder_secret_note" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" placeholder="Enter a unique detail only the true owner would know..."></textarea>
        </div>

        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Submit Report
        </button>
    </form>
    
    <div id="response-message" class="mt-4"></div>
</div>

<script>
    // Reveal the secret note field only if 'Found' is selected
    document.querySelectorAll('input[name="type"]').forEach((elem) => {
        elem.addEventListener("change", function(event) {
            const noteContainer = document.getElementById("secret-note-container");
            if (event.target.value === "Found") {
                noteContainer.classList.remove("hidden");
            } else {
                noteContainer.classList.add("hidden");
            }
        });
    });
</script>
{% endblock %}
